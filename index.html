<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Bookmarks</title>
    
  <!-- ★ オリジナルアイコン設定 -->
  <link rel="icon" type="image/png" sizes="32x32" href="maruto.png">
  <link rel="icon" type="image/png" sizes="192x192" href="maruto.png">
 
 
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    h1 {
      font-size: 20px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    .file-info {
      font-size: 11px;
      color: #9ca3af;
      margin-top: -6px;
      margin-bottom: 4px;
      padding-left: 4px;
      user-select: none;
    }

    .search {
      flex: 1;
      min-width: 180px;
      display: flex;
      justify-content: flex-end;
    }

    .search input {
      width: 100%;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .search input::placeholder {
      color: #64748b;
    }

    main {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 18px;
      border: 1px solid #1f2937;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(12px);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .section-header h2 {
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #9ca3af;
      cursor: pointer;
      user-select: none;
    }

    .tag.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    /* ▼ COLLECTION を縦並びに変更 */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ▼ カード幅を画面の80%に統一してセンタリング */
    .card {
      position: relative;
      background: radial-gradient(circle at top left, #1f2937 0, #020617 70%);
      border-radius: var(--radius);
      padding: 12px;
      border: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out, border-color 0.12s;

      width: 80%;
      margin: 0 auto;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.9);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .favicon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      border: 1px solid #1f2937;
      overflow: hidden;
    }

    .favicon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-url {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #6b7280;
    }

    .badge {
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
    }

    .pin {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 11px;
      color: #facc15;
    }

    @media (min-width: 768px) {
      main {
        padding: 20px;
      }
      h1 {
        font-size: 22px;
      }
      .grid {
        gap: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="title">
        <div class="logo">B</div>
        <div>
          <h1>My Bookmark Board</h1>
          <div class="subtitle">スマホでもPCでも同じ感覚で使えるスタートページ</div>
        </div>
      </div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="ブックマークを検索…" />
      </div>
    </header>

    <div id="fileInfo" class="file-info"></div>

    <main>
      <div class="section-header">
        <h2>Collections</h2>
        <div class="tags" id="tagBar"></div>
      </div>

      <section class="grid" id="bookmarkGrid"></section>
    </main>
  </div>

  <script>
    const bookmarks = [
      { title: "【通勤】西武バス（往路）", url: "https://transfer-cloud.navitime.biz/seibubus/transfers?origin=00110690&destination=00113434", tag: "Trafic", pinned: true },
      { title: "【通勤】西武バス（復路）", url: "https://transfer-cloud.navitime.biz/seibubus/transfers?origin=00113434&destination=00110690", tag: "Trafic", pinned: true },
      { title: "【通勤】Yahoo路線", url: "https://transit.yahoo.co.jp/search/result?from=%E5%9B%BD%E5%88%86%E5%AF%BA&to=%E8%A5%BF%E5%A4%A7%E4%BA%95", tag: "Trafic" },
      { title: "Amazon", url: "https://www.amazon.co.jp", tag: "Shopping" },
      { title: "Youtube", url: "https://myactivity.google.com/page?hl=ja&utm_medium=web&utm_source=youtube&page=youtube_comments", tag: "Opinion" },
      { title: "吉野家", url: "https://www.yoshinoya.com/", tag: "Food" },
      { title: "松屋", url: "https://www.matsuyafoods.co.jp/matsuya/", tag: "Food" },
      { title: "日高屋", url: "https://hidakaya.hiday.co.jp/", tag: "Food" },
      { title: "サイゼリヤ", url: "https://www.saizeriya.co.jp/", tag: "Food" }, 
      { title: "Yahooファイナンス", url: "https://finance.yahoo.co.jp/", tag: "Finance" },
      { title: "WTI原油相場", url: "https://nikkei225jp.com/oil/", tag: "Finance" },
      { title: "AP通信", url: "https://apnews.com/", tag: "Media" },
      { title: "日本経済新聞", url: "https://www.nikkei.com/", tag: "Media" },
      { title: "Tver", url: "https://tver.jp/", tag: "Media" }       
    ];

    let activeTag = "All";
    let searchKeyword = "";

    function getDomain(url) {
      try {
        return new URL(url).hostname.replace("www.", "");
      } catch {
        return url;
      }
    }

    function getFaviconUrl(url) {
      try {
        const u = new URL(url);
        return `${u.origin}/favicon.ico`;
      } catch {
        return "";
      }
    }

    const gridEl = document.getElementById("bookmarkGrid");
    const tagBarEl = document.getElementById("tagBar");
    const searchInputEl = document.getElementById("searchInput");

    function renderTags() {
      const tags = ["All", ...new Set(bookmarks.map(b => b.tag))];
      tagBarEl.innerHTML = "";
      tags.forEach(tag => {
        const btn = document.createElement("button");
        btn.textContent = tag;
        btn.className = "tag" + (tag === activeTag ? " active" : "");
        btn.addEventListener("click", () => {
          activeTag = tag;
          renderTags();
          renderGrid();
        });
        tagBarEl.appendChild(btn);
      });
    }

    function renderGrid() {
      gridEl.innerHTML = "";

      const filtered = bookmarks
        .filter(b => activeTag === "All" || b.tag === activeTag)
        .filter(b =>
          !searchKeyword ||
          b.title.toLowerCase().includes(searchKeyword) ||
          b.url.toLowerCase().includes(searchKeyword)
        )
        .sort((a, b) => (b.pinned === true) - (a.pinned === true));

      filtered.forEach(b => {
        const card = document.createElement("article");
        card.className = "card";
        card.addEventListener("click", () => {
          window.open(b.url, "_blank");
        });

        const faviconUrl = getFaviconUrl(b.url);

        card.innerHTML = `
          ${b.pinned ? '<div class="pin">★</div>' : ""}
          <div class="card-header">
            <div class="favicon">
              ${faviconUrl ? `<img src="${faviconUrl}" alt="">` : `<span>${b.title[0] ?? "?"}</span>`}
            </div>
            <div>
              <div class="card-title" title="${b.title}">${b.title}</div>
              <div class="card-url" title="${b.url}">${getDomain(b.url)}</div>
            </div>
          </div>
          <div class="card-footer">
            <span class="badge">${b.tag}</span>
            <span>開く</span>
          </div>
        `;

        gridEl.appendChild(card);
      });
    }

    searchInputEl.addEventListener("input", e => {
      searchKeyword = e.target.value.trim().toLowerCase();
      renderGrid();
    });

    const fileInfoEl = document.getElementById("fileInfo");
    const modified = new Date(document.lastModified);

    const y = modified.getFullYear();
    const m = String(modified.getMonth() + 1).padStart(2, "0");
    const d = String(modified.getDate()).padStart(2, "0");

    fileInfoEl.textContent = `Updated: ${y}-${m}-${d}`;

    renderTags();
    renderGrid();
  </script>
</body>
</html>
