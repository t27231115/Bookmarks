<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Bookmarks</title>
  <style>
    /* 以前のスタイルを継承 */
    :root { --bg: #0f172a; --accent: #38bdf8; --text: #e5e7eb; --muted: #9ca3af; }
    body { font-family: sans-serif; background: #020617; color: var(--text); padding-top: 100px; }
    header { position: fixed; top: 0; left: 0; width: 100%; height: 80px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #1f2937; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .header-inner { width: 100%; max-width: 1100px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
    .info-container { width: 100%; max-width: 1100px; margin: 0 auto 10px; display: flex; gap: 10px; }
    .file-info { font-size: 11px; color: var(--muted); background: #1e293b; padding: 4px 10px; border-radius: 4px; }
    main { width: 100%; max-width: 1100px; margin: 0 auto; background: #111827; padding: 20px; border-radius: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .tag { padding: 5px 15px; border-radius: 20px; background: #1f2937; border: 1px solid #374151; color: var(--muted); cursor: pointer; }
    .tag.active { border-color: var(--accent); color: var(--accent); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .card { background: #1f2937; padding: 15px; border-radius: 8px; border: 1px solid #374151; cursor: pointer; position: relative; }
    .card:hover { border-color: var(--accent); }
    .card-title { font-weight: bold; margin-bottom: 5px; }
    .card-url { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pin { position: absolute; top: 10px; right: 10px; color: #fbbf24; }
    #error-log { color: #f87171; font-size: 12px; margin-bottom: 10px; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>My Bookmark Board</h1>
    <input id="searchInput" type="text" placeholder="検索..." style="padding:8px; border-radius:20px; border:none; background:#0f172a; color:white;">
  </div>
</header>

<div class="info-container">
  <div id="htmlInfo" class="file-info">HTML: Loading...</div>
  <div id="jsonInfo" class="file-info">Bookmark: Loading...</div>
</div>

<main>
  <div id="error-log"></div>
  <div id="tagBar" class="tags"></div>
  <section id="bookmarkGrid" class="grid"></section>
</main>

<script>
  let bookmarks = [];
  let activeTag = "All";
  let searchKeyword = "";

  // HTML更新日
  document.getElementById("htmlInfo").textContent = `HTML Updated: ${document.lastModified}`;

  async function loadJSON() {
    const errorEl = document.getElementById("error-log");
    try {
      const response = await fetch("bookmarks.json", { cache: "no-store" });
      if (!response.ok) throw new Error("JSONファイルが見つかりません");
      
      const json = await response.json();
      
      // ここがポイント：VBAで出力した「updated」と「bookmarks」を読み取る
      document.getElementById("jsonInfo").textContent = `Bookmark Updated: ${json.updated || "不明"}`;
      bookmarks = json.bookmarks || [];
      
      renderTags();
      renderGrid();
    } catch (e) {
      errorEl.textContent = "【エラー】JSONの読み込みに失敗しました。VBAで出力したJSONの形式が崩れている可能性があります。: " + e.message;
      console.error(e);
    }
  }

  function renderTags() {
    const tagBar = document.getElementById("tagBar");
    const tags = ["All", ...new Set(bookmarks.map(b => b.tag))].sort();
    tagBar.innerHTML = "";
    tags.forEach(tag => {
      const btn = document.createElement("div");
      btn.textContent = tag;
      btn.className = "tag" + (tag === activeTag ? " active" : "");
      btn.onclick = () => { activeTag = tag; renderTags(); renderGrid(); };
      tagBar.appendChild(btn);
    });
  }

  function renderGrid() {
    const grid = document.getElementById("bookmarkGrid");
    grid.innerHTML = "";
    const filtered = bookmarks.filter(b => 
      (activeTag === "All" || b.tag === activeTag) &&
      (b.title.toLowerCase().includes(searchKeyword))
    );

    filtered.forEach(b => {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => window.open(b.url, "_blank");
      card.innerHTML = `
        ${b.pinned ? '<span class="pin">★</span>' : ""}
        <div class="card-title">${b.title}</div>
        <div class="card-url">${b.url}</div>
      `;
      grid.appendChild(card);
    });
  }

  document.getElementById("searchInput").oninput = (e) => {
    searchKeyword = e.target.value.toLowerCase();
    renderGrid();
  };

  loadJSON();
</script>
</body>
</html>
