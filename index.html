<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Bookmarks</title>

  <link rel="icon" type="image/png" sizes="32x32" href="maruto.png">
  <link rel="icon" type="image/png" sizes="192x192" href="maruto.png">

  <style>
    /* （CSS はあなたの元コードそのまま） */
    /* 省略せず全部入れることもできます。必要なら言ってください。 */
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="title">
        <div class="logo">B</div>
        <div>
          <h1>My Bookmark Board</h1>
          <div class="subtitle">スマホでもPCでも同じ感覚で使えるスタートページ</div>
        </div>
      </div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="ブックマークを検索…" />
      </div>
    </header>

    <div id="fileInfo" class="file-info"></div>

    <main>
      <div class="section-header">
        <h2>Collections</h2>
        <div class="tags" id="tagBar"></div>
      </div>

      <section class="grid" id="bookmarkGrid"></section>
    </main>
  </div>

  <script>
    let bookmarks = [];   // ← JSON 読み込み後にセットされる
    let activeTag = "All";
    let searchKeyword = "";

    function getDomain(url) {
      try { return new URL(url).hostname.replace("www.", ""); }
      catch { return url; }
    }

    function getFaviconUrl(url) {
      try {
        const u = new URL(url);
        return `${u.origin}/favicon.ico`;
      } catch {
        return "";
      }
    }

    const gridEl = document.getElementById("bookmarkGrid");
    const tagBarEl = document.getElementById("tagBar");
    const searchInputEl = document.getElementById("searchInput");

    /* ▼ TAG をアルファベット順にソートして表示 */
    function renderTags() {
      const tags = ["All", ...new Set(bookmarks.map(b => b.tag))];

      const sortedTags = ["All", ...tags.slice(1).sort((a, b) =>
        a.localeCompare(b, 'en', { sensitivity: 'base' })
      )];

      tagBarEl.innerHTML = "";
      sortedTags.forEach(tag => {
        const btn = document.createElement("button");
        btn.textContent = tag;
        btn.className = "tag" + (tag === activeTag ? " active" : "");
        btn.addEventListener("click", () => {
          activeTag = tag;
          renderTags();
          renderGrid();
        });
        tagBarEl.appendChild(btn);
      });
    }

    /* ▼ カードも TAG → pinned の順にソート */
    function renderGrid() {
      gridEl.innerHTML = "";

      const filtered = bookmarks
        .filter(b => activeTag === "All" || b.tag === activeTag)
        .filter(b =>
          !searchKeyword ||
          b.title.toLowerCase().includes(searchKeyword) ||
          b.url.toLowerCase().includes(searchKeyword)
        )
        .sort((a, b) => {
          const tagOrder = a.tag.localeCompare(b.tag, 'en', { sensitivity: 'base' });
          if (tagOrder !== 0) return tagOrder;
          return (b.pinned === true) - (a.pinned === true);
        });

      filtered.forEach(b => {
        const card = document.createElement("article");
        card.className = "card";
        card.addEventListener("click", () => window.open(b.url, "_blank"));

        const faviconUrl = getFaviconUrl(b.url);

        card.innerHTML = `
          ${b.pinned ? '<div class="pin">★</div>' : ""}
          <div class="card-header">
            <div class="favicon">
              ${faviconUrl ? `<img src="${faviconUrl}" alt="">` : `<span>${b.title[0] ?? "?"}</span>`}
            </div>
            <div>
              <div class="card-title" title="${b.title}">${b.title}</div>
              <div class="card-url" title="${b.url}">${getDomain(b.url)}</div>
            </div>
          </div>
          <div class="card-footer">
            <span class="badge">${b.tag}</span>
            <span>開く</span>
          </div>
        `;

        gridEl.appendChild(card);
      });
    }

    searchInputEl.addEventListener("input", e => {
      searchKeyword = e.target.value.trim().toLowerCase();
      renderGrid();
    });

    /* ▼ JSON を読み込んでから描画開始 */
    fetch("bookmarks.json")
      .then(res => res.json())
      .then(data => {
        bookmarks = data;
        renderTags();
        renderGrid();
      })
      .catch(err => console.error("JSON 読み込みエラー:", err));

    /* ▼ 更新日表示 */
    const fileInfoEl = document.getElementById("fileInfo");
    const modified = new Date(document.lastModified);
    fileInfoEl.textContent = `Updated: ${modified.getFullYear()}-${String(modified.getMonth()+1).padStart(2,"0")}-${String(modified.getDate()).padStart(2,"0")}`;
  </script>
</body>
</html>
