<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Bookmarks</title>

  <link rel="icon" type="image/png" sizes="32x32" href="maruto.png">
  <link rel="icon" type="image/png" sizes="192x192" href="maruto.png">

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      /* ヘッダー(80px) + 少しの余裕を持たせる余白 */
      padding-top: 100px;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 32px;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ▼ ヘッダーを画面最上部に完全固定 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
    }

    /* ヘッダー内部のコンテンツ幅を制限 */
    .header-inner {
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: white;
    }

    h1 {
      font-size: 18px;
      white-space: nowrap;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .file-info {
      font-size: 11px;
      color: #9ca3af;
      padding-left: 4px;
      margin-bottom: 4px;
    }

    .search {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      min-width: 120px;
    }

    .search input {
      width: 100%;
      max-width: 240px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search input:focus {
      border-color: var(--accent);
    }

    main {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 18px;
      border: 1px solid #1f2937;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(12px);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .section-header h2 {
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      background: radial-gradient(circle at top left, #1f2937 0, #020617 70%);
      border-radius: var(--radius);
      padding: 14px;
      border: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s ease-out, border-color 0.15s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .favicon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border: 1px solid #1f2937;
      overflow: hidden;
      flex-shrink: 0;
    }

    .favicon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-url {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #6b7280;
      margin-top: auto;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
    }

    .pin {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 12px;
      color: #facc15;
    }

    /* スマホ向け調整 */
    @media (max-width: 600px) {
      h1 { font-size: 15px; }
      .subtitle { display: none; } /* スマホではサブタイトルを隠してスッキリさせる */
      header { height: 70px; }
      body { padding-top: 85px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="header-inner">
        <div class="title">
          <div class="logo">B</div>
          <div>
            <h1>My Bookmark Board</h1>
            <div class="subtitle">スマホでもPCでも同じ感覚で使えるスタートページ</div>
          </div>
        </div>
        <div class="search">
          <input id="searchInput" type="search" placeholder="検索..." />
        </div>
      </div>
    </header>

    <div id="fileInfo" class="file-info"></div>

    <main>
      <div class="section-header">
        <h2>Collections</h2>
        <div class="tags" id="tagBar"></div>
      </div>

      <section class="grid" id="bookmarkGrid"></section>
    </main>
  </div>

  <script>
    let bookmarks = [];
    let activeTag = "All";
    let searchKeyword = "";

    function getDomain(url) {
      try { return new URL(url).hostname.replace("www.", ""); }
      catch { return url; }
    }

    function getFaviconUrl(url) {
      try {
        const u = new URL(url);
        return `${u.origin}/favicon.ico`;
      } catch {
        return "";
      }
    }

    const gridEl = document.getElementById("bookmarkGrid");
    const tagBarEl = document.getElementById("tagBar");
    const searchInputEl = document.getElementById("searchInput");

    // 検索イベント
    searchInputEl.addEventListener("input", (e) => {
      searchKeyword = e.target.value.toLowerCase();
      renderGrid();
    });

    function renderTags() {
      const tags = ["All", ...new Set(bookmarks.map(b => b.tag))];
      const sortedTags = ["All", ...tags.slice(1).sort((a, b) =>
        a.localeCompare(b, 'en', { sensitivity: 'base' })
      )];

      tagBarEl.innerHTML = "";
      sortedTags.forEach(tag => {
        const btn = document.createElement("button");
        btn.textContent = tag;
        btn.className = "tag" + (tag === activeTag ? " active" : "");
        btn.addEventListener("click", () => {
          activeTag = tag;
          renderTags();
          renderGrid();
        });
        tagBarEl.appendChild(btn);
      });
    }

    function renderGrid() {
      gridEl.innerHTML = "";

      const filtered = bookmarks
        .filter(b => activeTag === "All" || b.tag === activeTag)
        .filter(b =>
          !searchKeyword ||
          b.title.toLowerCase().includes(searchKeyword) ||
          b.url.toLowerCase().includes(searchKeyword)
        );

      filtered.forEach(b => {
        const card = document.createElement("article");
        card.className = "card";
        card.addEventListener("click", () => window.open(b.url, "_blank"));

        const faviconUrl = getFaviconUrl(b.url);

        card.innerHTML = `
          ${b.pinned ? '<div class="pin">★</div>' : ""}
          <div class="card-header">
            <div class="favicon">
              ${faviconUrl ? `<img src="${faviconUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">` : ""}
              <span style="display:${faviconUrl ? 'none' : 'block'}">${b.title[0] ?? "?"}</span>
            </div>
            <div style="overflow:hidden">
              <div class="card-title" title="${b.title}">${b.title}</div>
              <div class="card-url" title="${b.url}">${getDomain(b.url)}</div>
            </div>
          </div>
          <div class="card-footer">
            <span class="badge">${b.tag}</span>
            <span>Open →</span>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    fetch("bookmarks.json", { cache: "no-store" })
      .then(res => {
        const lastModified = res.headers.get("Last-Modified");
        if (lastModified) {
          const date = new Date(lastModified);
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, "0");
          const d = String(date.getDate()).padStart(2, "0");
          const hh = String(date.getHours()).padStart(2, "0");
          const mm = String(date.getMinutes()).padStart(2, "0");
          document.getElementById("fileInfo").textContent = `Updated: ${y}-${m}-${d} ${hh}:${mm}`;
        }
        return res.json();
      })
      .then(data => {
        bookmarks = data;
        renderTags();
        renderGrid();
      })
      .catch(err => {
        console.error("JSON 読み込みエラー:", err);
        // JSONがない場合のダミー表示（デバッグ用）
        document.getElementById("bookmarkGrid").innerHTML = "<p style='color:red; font-size:12px;'>bookmarks.json が読み込めませんでした。ファイル配置を確認してください。</p>";
      });
  </script>
</body>
</html>
